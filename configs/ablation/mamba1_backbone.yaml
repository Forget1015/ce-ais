# 消融实验: Mamba-1 替换 Mamba-3
# 禁用复数域状态更新和 MIMO 并行
inherit_from: "../base.yaml"

ce_wm:
  backbone: "mamba1"           # 替换为 Mamba-1
  use_complex: false           # 禁用复数域
  mimo_groups: 1               # 禁用 MIMO
  d_model: 512
  d_state: 64
  n_layers: 24
  expand_factor: 2
  action_dim: 7
  latent_dim: 128
  dropout: 0.1
