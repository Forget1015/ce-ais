# Safe CE-AIS balanced profile: restores useful steering strength while preserving trust-region fallback.
inherit_from: base.yaml

steering:
  n_steps: 2
  step_size: 0.006
  anneal_rate: 0.5
  noise_scale: 0.0
  kl_weight: 25.0
  grad_mode: "finite_diff"
  enable_trust_region: true
  action_delta_max: 0.08
  enable_accept_reject: true
  accept_energy_margin: 0.0001
  diagnostics: true
  mode: "langevin"
  candidate_count: 0
  candidate_noise_std: 0.01
  deviation_weight: 10.0

bilateral_gating:
  lambda_max: 0.4
  sensitivity: 0.1
  window_size: 50
  uncertainty_method: "mc_dropout"
  mc_samples: 5
  hard_uncertainty_threshold: null
  min_lambda: 0.0
