hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - train_folder=/data0/yejinxuan/ce-ais/data/flower_calvin_abc/.hydra/config.yaml
    - checkpoint=/data0/yejinxuan/ce-ais/data/flower_calvin_abc/flower_abc.ckpt
    - dataset_path=/data0/yejinxuan/ce-ais/data/task_ABC_D
    - device=0
    - num_sequences=1000
    - num_videos=0
    - debug=False
    - log_wandb=False
    - log_dir=/data0/yejinxuan/ce-ais/results/flower_official_eval
  job:
    name: flower_evaluate
    chdir: null
    override_dirname: checkpoint=/data0/yejinxuan/ce-ais/data/flower_calvin_abc/flower_abc.ckpt,dataset_path=/data0/yejinxuan/ce-ais/data/task_ABC_D,debug=False,device=0,log_dir=/data0/yejinxuan/ce-ais/results/flower_official_eval,log_wandb=False,num_sequences=1000,num_videos=0,train_folder=/data0/yejinxuan/ce-ais/data/flower_calvin_abc/.hydra/config.yaml
    id: ???
    num: ???
    config_name: eval_calvin
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /data0/yejinxuan/ce-ais
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data0/yejinxuan/ce-ais/external/flower_vla_calvin/conf
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data0/yejinxuan/ce-ais/outputs/2026-06-09/03-15-50
    choices:
      callbacks/rollout_lh/tasks@tasks: new_playtable_tasks
      annotations: new_playtable_validation
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
