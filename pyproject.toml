[project]
name = "ce-ais"
version = "0.1.0"
description = "CE-AIS: Causal-Energy Active Inference Steering - A gradient-free test-time adaptation framework for embodied AI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.1.0,<2.6.0",
    "torchvision>=0.16.0,<0.21.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "tensorboard>=2.14.0",
    "tqdm>=4.65.0",
    "einops>=0.7.0",
    "matplotlib>=3.7.0",
    "pytest>=7.4.0",
    "hypothesis>=6.82.0",
    "pytest-cov>=4.1.0",
    "pillow>=10.0.0",
    "accelerate>=0.30.0",
    "setuptools==80.9.0",
    "wandb>=0.27.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
# OpenVLA 真实推理需要的重型依赖；CI 默认不安装
# 用法: uv sync --extra vla
vla = [
    "transformers>=4.40.0,<4.50.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "timm>=0.9.10",
]
# 8bit / 4bit 量化（4090 24GB 紧凑显存场景）
# 用法: uv sync --extra vla --extra quant
quant = [
    "bitsandbytes>=0.43.0",
]
# 大模型权重高速下载（HuggingFace Hub 加速）
hf-fast = [
    "hf_transfer>=0.1.6",
]
# Mamba-3 真实加速（Week 3 才安装）
# 用法: uv sync --extra mamba
mamba = [
    "mamba-ssm>=2.2.0",
    "causal-conv1d>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# 默认使用清华镜像加速 PyPI 下载
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

